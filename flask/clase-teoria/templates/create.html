{% extends 'base.html' %}
{% block content %}
<div class="form-container">
    <h2>Agregar Nuevo Libro</h2>
    <form action="/insert" method="POST" class="styled-form">
        <div class="form-group">
            <label for="libro">Título del Libro</label>
            <input type="text" id="libro" name="libro" required placeholder="Ej: Cien años de soledad">
        </div>
        <div class="form-group">
            <label for="reseña">Reseña</label>
            <textarea id="reseña" name="reseña" rows="5" required placeholder="Escribe una breve reseña..."></textarea>
        </div>
        <div class="form-actions">
            <a href="/" class="btn btn-outline">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar Libro</button>
        </div>
    </form>
</div>
{% endblock %}
